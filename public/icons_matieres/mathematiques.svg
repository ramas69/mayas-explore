<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgMath" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d03f"/>
      <stop offset="50%" style="stop-color:#d4ac0d"/>
      <stop offset="100%" style="stop-color:#b7950b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgMath)" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Mathematical symbols -->
  <text x="100" y="75" text-anchor="middle" font-family="Georgia, serif" font-size="45" fill="url(#goldGrad)" filter="url(#glow)">∫</text>
  <text x="65" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="35" fill="url(#goldGrad)" filter="url(#glow)">π</text>
  <text x="135" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="35" fill="url(#goldGrad)" filter="url(#glow)">√</text>
  <text x="100" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="40" fill="url(#goldGrad)" filter="url(#glow)">∑</text>

  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3"/>
</svg>