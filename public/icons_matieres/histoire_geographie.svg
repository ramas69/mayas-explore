<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgHist" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d03f"/>
      <stop offset="50%" style="stop-color:#d4ac0d"/>
      <stop offset="100%" style="stop-color:#b7950b"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgHist)" stroke="url(#goldGrad3)" stroke-width="3"/>

  <!-- Globe -->
  <circle cx="100" cy="100" r="55" fill="none" stroke="url(#goldGrad3)" stroke-width="2.5" filter="url(#glow3)"/>

  <!-- Meridians -->
  <ellipse cx="100" cy="100" rx="20" ry="55" fill="none" stroke="url(#goldGrad3)" stroke-width="1.5" opacity="0.7"/>
  <ellipse cx="100" cy="100" rx="40" ry="55" fill="none" stroke="url(#goldGrad3)" stroke-width="1.5" opacity="0.7"/>

  <!-- Parallels -->
  <ellipse cx="100" cy="100" rx="55" ry="20" fill="none" stroke="url(#goldGrad3)" stroke-width="1.5" opacity="0.7"/>
  <ellipse cx="100" cy="100" rx="55" ry="40" fill="none" stroke="url(#goldGrad3)" stroke-width="1.5" opacity="0.7"/>

  <!-- Stand -->
  <path d="M70 155 Q100 175 130 155" fill="none" stroke="url(#goldGrad3)" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="155" x2="100" y2="170" stroke="url(#goldGrad3)" stroke-width="3"/>

  <!-- Compass rose decoration -->
  <path d="M165 35 L170 50 L175 35 L170 20 Z" fill="url(#goldGrad3)" opacity="0.6"/>
  <circle cx="170" cy="35" r="3" fill="url(#goldGrad3)"/>
</svg>