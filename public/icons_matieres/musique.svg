<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgMus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="goldGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d03f"/>
      <stop offset="50%" style="stop-color:#d4ac0d"/>
      <stop offset="100%" style="stop-color:#b7950b"/>
    </linearGradient>
    <filter id="glow7">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgMus)" stroke="url(#goldGrad7)" stroke-width="3"/>

  <!-- Musical staff lines -->
  <line x1="40" y1="75" x2="160" y2="75" stroke="url(#goldGrad7)" stroke-width="1" opacity="0.4"/>
  <line x1="40" y1="85" x2="160" y2="85" stroke="url(#goldGrad7)" stroke-width="1" opacity="0.4"/>
  <line x1="40" y1="95" x2="160" y2="95" stroke="url(#goldGrad7)" stroke-width="1" opacity="0.4"/>
  <line x1="40" y1="105" x2="160" y2="105" stroke="url(#goldGrad7)" stroke-width="1" opacity="0.4"/>
  <line x1="40" y1="115" x2="160" y2="115" stroke="url(#goldGrad7)" stroke-width="1" opacity="0.4"/>

  <!-- Eighth note -->
  <ellipse cx="85" cy="105" rx="12" ry="10" fill="url(#goldGrad7)" filter="url(#glow7)"/>
  <ellipse cx="125" cy="95" rx="12" ry="10" fill="url(#goldGrad7)" filter="url(#glow7)"/>

  <!-- Note stems -->
  <line x1="97" y1="105" x2="97" y2="55" stroke="url(#goldGrad7)" stroke-width="3"/>
  <line x1="137" y1="95" x2="137" y2="45" stroke="url(#goldGrad7)" stroke-width="3"/>

  <!-- Note beam -->
  <path d="M97 55 Q117 50 137 45" fill="none" stroke="url(#goldGrad7)" stroke-width="4"/>

  <!-- Treble clef -->
  <text x="55" y="110" font-family="Georgia, serif" font-size="50" fill="url(#goldGrad7)" opacity="0.6">𝄞</text>
</svg>