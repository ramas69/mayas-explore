<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgPhilo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="goldGrad12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d03f"/>
      <stop offset="50%" style="stop-color:#d4ac0d"/>
      <stop offset="100%" style="stop-color:#b7950b"/>
    </linearGradient>
    <filter id="glow12">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgPhilo)" stroke="url(#goldGrad12)" stroke-width="3"/>

  <!-- Owl body -->
  <ellipse cx="100" cy="110" rx="35" ry="40" fill="none" stroke="url(#goldGrad12)" stroke-width="2.5" filter="url(#glow12)"/>

  <!-- Owl head -->
  <circle cx="100" cy="75" r="25" fill="none" stroke="url(#goldGrad12)" stroke-width="2.5"/>

  <!-- Eyes -->
  <circle cx="90" cy="72" r="8" fill="none" stroke="url(#goldGrad12)" stroke-width="2"/>
  <circle cx="110" cy="72" r="8" fill="none" stroke="url(#goldGrad12)" stroke-width="2"/>
  <circle cx="90" cy="72" r="3" fill="url(#goldGrad12)"/>
  <circle cx="110" cy="72" r="3" fill="url(#goldGrad12)"/>

  <!-- Beak -->
  <path d="M100 80 L95 88 L100 85 L105 88 Z" fill="url(#goldGrad12)"/>

  <!-- Ear tufts -->
  <path d="M78 58 L75 45 L85 55" fill="none" stroke="url(#goldGrad12)" stroke-width="2"/>
  <path d="M122 58 L125 45 L115 55" fill="none" stroke="url(#goldGrad12)" stroke-width="2"/>

  <!-- Wings -->
  <path d="M65 100 Q55 110 65 130" fill="none" stroke="url(#goldGrad12)" stroke-width="2"/>
  <path d="M135 100 Q145 110 135 130" fill="none" stroke="url(#goldGrad12)" stroke-width="2"/>

  <!-- Question mark -->
  <text x="155" y="55" font-family="Georgia, serif" font-size="30" fill="url(#goldGrad12)" opacity="0.7">?</text>
</svg>