<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgTech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="goldGrad10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d03f"/>
      <stop offset="50%" style="stop-color:#d4ac0d"/>
      <stop offset="100%" style="stop-color:#b7950b"/>
    </linearGradient>
    <filter id="glow10">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgTech)" stroke="url(#goldGrad10)" stroke-width="3"/>

  <!-- Main gear -->
  <circle cx="100" cy="100" r="35" fill="none" stroke="url(#goldGrad10)" stroke-width="2.5" filter="url(#glow10)"/>
  <circle cx="100" cy="100" r="20" fill="none" stroke="url(#goldGrad10)" stroke-width="2"/>

  <!-- Gear teeth -->
  <rect x="95" y="55" width="10" height="12" fill="url(#goldGrad10)"/>
  <rect x="95" y="133" width="10" height="12" fill="url(#goldGrad10)"/>
  <rect x="55" y="95" width="12" height="10" fill="url(#goldGrad10)"/>
  <rect x="133" y="95" width="12" height="10" fill="url(#goldGrad10)"/>

  <!-- Diagonal teeth -->
  <rect x="67" y="67" width="10" height="10" fill="url(#goldGrad10)" transform="rotate(45 72 72)"/>
  <rect x="123" y="67" width="10" height="10" fill="url(#goldGrad10)" transform="rotate(45 128 72)"/>
  <rect x="67" y="123" width="10" height="10" fill="url(#goldGrad10)" transform="rotate(45 72 128)"/>
  <rect x="123" y="123" width="10" height="10" fill="url(#goldGrad10)" transform="rotate(45 128 128)"/>

  <!-- Circuit lines -->
  <line x1="45" y1="100" x2="25" y2="100" stroke="url(#goldGrad10)" stroke-width="2" opacity="0.6"/>
  <line x1="25" y1="100" x2="25" y2="130" stroke="url(#goldGrad10)" stroke-width="2" opacity="0.6"/>
  <circle cx="25" cy="135" r="4" fill="url(#goldGrad10)"/>

  <line x1="155" y1="100" x2="175" y2="100" stroke="url(#goldGrad10)" stroke-width="2" opacity="0.6"/>
  <line x1="175" y1="100" x2="175" y2="70" stroke="url(#goldGrad10)" stroke-width="2" opacity="0.6"/>
  <circle cx="175" cy="65" r="4" fill="url(#goldGrad10)"/>

  <!-- Center dot -->
  <circle cx="100" cy="100" r="6" fill="url(#goldGrad10)"/>
</svg>