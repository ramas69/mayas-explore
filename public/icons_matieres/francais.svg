<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgFr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="goldGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d03f"/>
      <stop offset="50%" style="stop-color:#d4ac0d"/>
      <stop offset="100%" style="stop-color:#b7950b"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgFr)" stroke="url(#goldGrad4)" stroke-width="3"/>

  <!-- Open book -->
  <path d="M55 70 Q75 60 100 75 Q125 60 145 70 L145 140 Q125 130 100 145 Q75 130 55 140 Z" 
        fill="none" stroke="url(#goldGrad4)" stroke-width="2.5" filter="url(#glow4)"/>

  <!-- Book spine -->
  <line x1="100" y1="75" x2="100" y2="145" stroke="url(#goldGrad4)" stroke-width="2"/>

  <!-- Text lines left page -->
  <line x1="65" y1="85" x2="90" y2="85" stroke="url(#goldGrad4)" stroke-width="1.5" opacity="0.6"/>
  <line x1="65" y1="95" x2="90" y2="95" stroke="url(#goldGrad4)" stroke-width="1.5" opacity="0.6"/>
  <line x1="65" y1="105" x2="90" y2="105" stroke="url(#goldGrad4)" stroke-width="1.5" opacity="0.6"/>
  <line x1="65" y1="115" x2="85" y2="115" stroke="url(#goldGrad4)" stroke-width="1.5" opacity="0.6"/>

  <!-- Text lines right page -->
  <line x1="110" y1="85" x2="135" y2="85" stroke="url(#goldGrad4)" stroke-width="1.5" opacity="0.6"/>
  <line x1="110" y1="95" x2="135" y2="95" stroke="url(#goldGrad4)" stroke-width="1.5" opacity="0.6"/>
  <line x1="110" y1="105" x2="135" y2="105" stroke="url(#goldGrad4)" stroke-width="1.5" opacity="0.6"/>
  <line x1="110" y1="115" x2="130" y2="115" stroke="url(#goldGrad4)" stroke-width="1.5" opacity="0.6"/>

  <!-- Quill pen -->
  <path d="M140 50 Q150 70 145 85 Q140 75 135 65 Q130 55 140 50" 
        fill="url(#goldGrad4)" filter="url(#glow4)"/>
  <line x1="145" y1="85" x2="148" y2="95" stroke="url(#goldGrad4)" stroke-width="2"/>
</svg>