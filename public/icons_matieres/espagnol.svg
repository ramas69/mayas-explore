<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgEs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="goldGrad11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d03f"/>
      <stop offset="50%" style="stop-color:#d4ac0d"/>
      <stop offset="100%" style="stop-color:#b7950b"/>
    </linearGradient>
    <filter id="glow11">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgEs)" stroke="url(#goldGrad11)" stroke-width="3"/>

  <!-- Sun center -->
  <circle cx="100" cy="100" r="25" fill="url(#goldGrad11)" filter="url(#glow11)"/>

  <!-- Sun rays -->
  <line x1="100" y1="55" x2="100" y2="35" stroke="url(#goldGrad11)" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="145" x2="100" y2="165" stroke="url(#goldGrad11)" stroke-width="4" stroke-linecap="round"/>
  <line x1="55" y1="100" x2="35" y2="100" stroke="url(#goldGrad11)" stroke-width="4" stroke-linecap="round"/>
  <line x1="145" y1="100" x2="165" y2="100" stroke="url(#goldGrad11)" stroke-width="4" stroke-linecap="round"/>

  <!-- Diagonal rays -->
  <line x1="68" y1="68" x2="54" y2="54" stroke="url(#goldGrad11)" stroke-width="3" stroke-linecap="round"/>
  <line x1="132" y1="68" x2="146" y2="54" stroke="url(#goldGrad11)" stroke-width="3" stroke-linecap="round"/>
  <line x1="68" y1="132" x2="54" y2="146" stroke="url(#goldGrad11)" stroke-width="3" stroke-linecap="round"/>
  <line x1="132" y1="132" x2="146" y2="146" stroke="url(#goldGrad11)" stroke-width="3" stroke-linecap="round"/>

  <!-- "Ñ" letter -->
  <text x="100" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="url(#goldGrad11)">Ñ</text>
</svg>