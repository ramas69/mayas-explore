<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgPhys" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d03f"/>
      <stop offset="50%" style="stop-color:#d4ac0d"/>
      <stop offset="100%" style="stop-color:#b7950b"/>
    </linearGradient>
    <radialGradient id="nucleus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f4d03f"/>
      <stop offset="100%" style="stop-color:#d4ac0d"/>
    </radialGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgPhys)" stroke="url(#goldGrad2)" stroke-width="3"/>

  <!-- Electron orbits -->
  <ellipse cx="100" cy="100" rx="60" ry="25" fill="none" stroke="url(#goldGrad2)" stroke-width="2" opacity="0.8" transform="rotate(0 100 100)"/>
  <ellipse cx="100" cy="100" rx="60" ry="25" fill="none" stroke="url(#goldGrad2)" stroke-width="2" opacity="0.8" transform="rotate(60 100 100)"/>
  <ellipse cx="100" cy="100" rx="60" ry="25" fill="none" stroke="url(#goldGrad2)" stroke-width="2" opacity="0.8" transform="rotate(120 100 100)"/>

  <!-- Nucleus -->
  <circle cx="100" cy="100" r="15" fill="url(#nucleus)" filter="url(#glow2)"/>

  <!-- Electrons -->
  <circle cx="160" cy="100" r="6" fill="#f4d03f" filter="url(#glow2)"/>
  <circle cx="55" cy="65" r="6" fill="#f4d03f" filter="url(#glow2)"/>
  <circle cx="55" cy="135" r="6" fill="#f4d03f" filter="url(#glow2)"/>
</svg>