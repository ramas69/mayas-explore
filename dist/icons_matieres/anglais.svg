<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="goldGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d03f"/>
      <stop offset="50%" style="stop-color:#d4ac0d"/>
      <stop offset="100%" style="stop-color:#b7950b"/>
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgEn)" stroke="url(#goldGrad5)" stroke-width="3"/>

  <!-- Crown -->
  <path d="M50 130 L50 90 L70 105 L100 70 L130 105 L150 90 L150 130 Q100 145 50 130 Z" 
        fill="none" stroke="url(#goldGrad5)" stroke-width="2.5" filter="url(#glow5)"/>

  <!-- Crown base -->
  <rect x="50" y="120" width="100" height="12" fill="none" stroke="url(#goldGrad5)" stroke-width="2"/>

  <!-- Jewels on crown -->
  <circle cx="100" cy="85" r="5" fill="url(#goldGrad5)"/>
  <circle cx="70" cy="105" r="4" fill="url(#goldGrad5)"/>
  <circle cx="130" cy="105" r="4" fill="url(#goldGrad5)"/>

  <!-- Cross on top -->
  <line x1="100" y1="55" x2="100" y2="70" stroke="url(#goldGrad5)" stroke-width="2"/>
  <line x1="93" y1="62" x2="107" y2="62" stroke="url(#goldGrad5)" stroke-width="2"/>

  <!-- "A" letter -->
  <text x="100" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="url(#goldGrad5)">A</text>
</svg>