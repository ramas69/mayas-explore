<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgEPS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="goldGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d03f"/>
      <stop offset="50%" style="stop-color:#d4ac0d"/>
      <stop offset="100%" style="stop-color:#b7950b"/>
    </linearGradient>
    <filter id="glow9">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgEPS)" stroke="url(#goldGrad9)" stroke-width="3"/>

  <!-- Running figure stylized -->
  <circle cx="85" cy="65" r="10" fill="none" stroke="url(#goldGrad9)" stroke-width="2.5" filter="url(#glow9)"/>

  <!-- Body -->
  <line x1="85" y1="75" x2="85" y2="105" stroke="url(#goldGrad9)" stroke-width="3" stroke-linecap="round"/>

  <!-- Arms -->
  <line x1="85" y1="85" x2="65" y2="75" stroke="url(#goldGrad9)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="85" y1="85" x2="110" y2="70" stroke="url(#goldGrad9)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Legs -->
  <line x1="85" y1="105" x2="70" y2="130" stroke="url(#goldGrad9)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="85" y1="105" x2="105" y2="125" stroke="url(#goldGrad9)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Motion lines -->
  <path d="M120 60 Q135 55 145 65" fill="none" stroke="url(#goldGrad9)" stroke-width="2" opacity="0.6"/>
  <path d="M125 70 Q140 65 150 75" fill="none" stroke="url(#goldGrad9)" stroke-width="2" opacity="0.6"/>

  <!-- Laurel wreath decoration -->
  <path d="M50 150 Q60 140 70 150" fill="none" stroke="url(#goldGrad9)" stroke-width="2"/>
  <path d="M130 150 Q140 140 150 150" fill="none" stroke="url(#goldGrad9)" stroke-width="2"/>
</svg>